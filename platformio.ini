; =====================================================================
; Keyboard36 v0.1 — ESP32-P4 电源自锁(POWER_ON / GPIO19)测试固件
; Platform: pioarduino 社区平台 (Arduino core 3.3.x / ESP-IDF v5.5.x)
; 注: PlatformIO 官方 espressif32 平台暂不支持 ESP32-P4, 故用 pioarduino
; =====================================================================
[platformio]
default_envs = keyboard36_p4

[env:keyboard36_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = keyboard36_p4            ; 项目内自定义板卡定义: boards/keyboard36_p4.json
framework = arduino

; --- 烧录 / 串口监视 ---
upload_port = COM9               ; CH9102 USB 转串口适配器(接主板 H2 调试座)
upload_speed = 115200            ; 串口链路质量差时低速最稳(921600 易丢字节)
; 板子无自动复位电路: esptool 不做任何复位操作,
; 由使用者手动进下载模式(按住 BOOT -> 短触 RESET -> 松开)后再启动 Upload
upload_flags =
    --before=no_reset
    --after=no_reset
monitor_port = COM9
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Flash 配置说明 ---
; 板卡定义默认按 4MB 保守配置(default.csv 分区, 在 4/8/16MB 芯片上均可安全启动)。
; 待确认板上 U5(SOP-8 SPI Flash)实际容量为 16MB 后, 可改回:
;   board_upload.flash_size = 16MB
;   board_build.partitions = default_16MB.csv

; --- 自定义 ESP-IDF 配置(诊断重启循环: 2026-10-23) ---
; 实际配置直接写入工程 sdkconfig.defaults(此处的 custom_sdkconfig 会触发
; pioarduino 的 libs 重编路径, 与哈希目录名不兼容, 构建会失败, 故弃用):
;   CONFIG_BOOTLOADER_LOG_LEVEL_INFO=y  (bootloader INFO 日志 -> 看卡在哪一步)
;   # CONFIG_BOOTLOADER_WDT_ENABLE is not set (关闭 bootloader 阶段 RTC/LP 看门狗)
;   CONFIG_ESPTOOLPY_FLASHFREQ_40M=y / FLASHMODE_DIO (降速 + DIO, 治根因)
; board json 同步: f_flash=40000000L, flash_mode=dio
