; =====================================================================
; Keyboard36 v0.1 — ESP32-P4 电源自锁(POWER_ON / GPIO19)测试固件
; Platform: pioarduino 社区平台 (Arduino core 3.3.x / ESP-IDF v5.5.x)
; 注: PlatformIO 官方 espressif32 平台暂不支持 ESP32-P4, 故用 pioarduino
; =====================================================================
[platformio]
default_envs = keyboard36_p4

[env:keyboard36_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = keyboard36_p4            ; 项目内自定义板卡定义: boards/keyboard36_p4.json
framework = arduino

; --- 烧录 / 串口监视 ---
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Flash 配置说明 ---
; 板卡定义默认按 4MB 保守配置(default.csv 分区, 在 4/8/16MB 芯片上均可安全启动)。
; 待确认板上 U5(SOP-8 SPI Flash)实际容量为 16MB 后, 可改回:
;   board_upload.flash_size = 16MB
;   board_build.partitions = default_16MB.csv
